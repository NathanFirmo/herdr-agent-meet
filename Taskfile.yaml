version: '3'

dotenv: ['.env']

env:
  UID:
    sh: id -u
  GID:
    sh: id -g

tasks:
  up:
    desc: Build and start the app and Kokoro in Docker
    cmds:
      # Created as the host user; a directory created by Docker would be owned by root.
      - mkdir -p "${UPLOAD_DIR:-/tmp/agent-meet}"
      - docker compose up --build -d
      - echo "Agent Meet em http://localhost:${PORT:-8765}"

  start:
    desc: Pull the published image and start the app and Kokoro, without building
    cmds:
      - mkdir -p "${UPLOAD_DIR:-/tmp/agent-meet}"
      - docker compose pull
      - docker compose up -d --no-build
      - echo "Agent Meet em http://localhost:${PORT:-8765}"

  publish:
    desc: Build and push the image to Docker Hub, tagged VERSION and latest
    requires:
      vars: [VERSION]
    cmds:
      - docker build --platform linux/amd64 -t nathanfirmo/herdr-agent-meet:{{.VERSION}} -t nathanfirmo/herdr-agent-meet:latest .
      - docker push nathanfirmo/herdr-agent-meet:{{.VERSION}}
      - docker push nathanfirmo/herdr-agent-meet:latest

  down:
    desc: Stop the Docker stack
    cmds:
      - docker compose down

  logs:
    desc: Follow the app logs
    cmds:
      - docker compose logs -f app

  kokoro:
    desc: Start only Kokoro in Docker, for running the app on the host
    cmds:
      - docker compose up -d kokoro

  dev:
    desc: Run Kokoro in Docker and the API and web dev server on the host
    deps: [kokoro]
    cmds:
      - task: dev:run

  dev:run:
    internal: true
    deps: [dev:api, dev:web]

  dev:api:
    desc: Run the Go API on the host
    cmds:
      - go run ./cmd/agent-meet

  dev:web:
    desc: Run the Vite dev server with hot reload
    dir: web
    cmds:
      - npm install
      - npm run dev

  build:
    desc: Build the web bundle and the Go binary
    cmds:
      - cd web && npm ci && npm run build
      - go build -o bin/agent-meet ./cmd/agent-meet

  check:
    desc: Run formatters, vet and lint
    cmds:
      - gofmt -l . | (! grep .)
      - go vet ./...
      - cd web && npm run lint && npx tsc -b
