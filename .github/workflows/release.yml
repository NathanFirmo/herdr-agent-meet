name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  IMAGE: nathanfirmo/herdr-agent-meet
  DOCKER_HUB_USERNAME: nathanfirmo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Herdr installs the plugin from the repository, so its manifest must
      # announce the same version as the image the tag publishes.
      - name: Match the plugin version
        run: |
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          if [ "v$plugin" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=herdr-plugin.toml::version is $plugin, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Check web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # v1.2.3 is pushed as 1.2.3, 1.2 and latest; prereleases like
      # v1.2.3-rc.1 only as themselves.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease \
            --notes "Docker image: \`docker pull $IMAGE:$version\`"
