services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped

  app:
    image: nathanfirmo/herdr-agent-meet:${AGENT_MEET_VERSION:-latest}
    build: .
    depends_on:
      - kokoro
    # Runs as the host user so it can open the Herdr socket.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    environment:
      TTS: ${TTS:-kokoro}
      KOKORO_URL: http://kokoro:8880
      MEET_LANGUAGE: ${MEET_LANGUAGE:-}
      VOICES: ${VOICES:-}
      SPEECH_SPEED: ${SPEECH_SPEED:-1.1}
      POLL_INTERVAL: ${POLL_INTERVAL:-3s}
      SUMMARIZER: ${SUMMARIZER:-}
      SUMMARY_COMMAND: ${SUMMARY_COMMAND:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/agent-meet}
      # The host home, for "~" in folder completion; the container's own HOME differs.
      HOST_HOME: ${HOME}
      CLAUDE_TRANSCRIPT_DIRS: ${CLAUDE_TRANSCRIPT_DIRS:-${HOME}/.claude*}
    volumes:
      # The whole directory is mounted so a restarted Herdr server's new socket is still reachable.
      - ${HERDR_DIR:-~/.config/herdr}:/run/herdr
      # Optional host CLI for SUMMARY_COMMAND; /dev/null keeps the mount harmless when unset.
      - ${CLAUDE_BIN:-/dev/null}:/usr/local/bin/claude:ro
      - ${CLAUDE_CONFIG_DIR:-/dev/null}:/claude-config
      # Same path inside and outside, so agents on the host can open chat images.
      - ${UPLOAD_DIR:-/tmp/agent-meet}:${UPLOAD_DIR:-/tmp/agent-meet}
      # Read-only home at the same path, to follow Claude Code transcripts in CLAUDE_TRANSCRIPT_DIRS.
      - ${HOME}:${HOME}:ro
    restart: unless-stopped
